server.port=8080
spring.application.name=dbest-api
# Allow large query results
spring.mvc.async.request-timeout=300000

# Allow large table-file uploads (.dat BTree files can be tens/hundreds of MB).
# Spring Boot's default is 1MB, which silently rejected every .dat bigger than
# ~1MB (e.g. person.dat 20MB, movieCast.dat 62MB) — the rejection resets the
# connection and the browser reports it as "Failed to fetch".
spring.servlet.multipart.max-file-size=1GB
spring.servlet.multipart.max-request-size=1GB
# When a request is still rejected, let Tomcat read the whole body so the client
# gets a clean error response instead of a dropped connection.
server.tomcat.max-swallow-size=-1
